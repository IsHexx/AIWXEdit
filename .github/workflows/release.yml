name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check

      - name: Verify reproducible build
        run: |
          cp main.js "$RUNNER_TEMP/aiwxedit-main.js"
          npm run build
          cmp main.js "$RUNNER_TEMP/aiwxedit-main.js"

      # Only upload Obsidian-required artifacts; do not ship theme packs.
      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
